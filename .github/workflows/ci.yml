name: CI

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npx eslint main.ts src test

            - name: Typecheck and test with coverage
              run: npm run verify

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage
                  path: coverage/
                  if-no-files-found: ignore
